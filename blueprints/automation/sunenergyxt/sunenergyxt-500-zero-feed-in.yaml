                        | float(0) | round(0) }}W | gp={{ gp_power_w | float(0) | round(0) }}W
                        | lp={{ load_power_w | float(0) | round(0) }}W | pv={{ pv_power_w |
                        float(0) | round(0) }}W
          - service: input_boolean.turn_off
            target:
              entity_id: "{{ full_hold_entity | trim }}"
  - choose:
