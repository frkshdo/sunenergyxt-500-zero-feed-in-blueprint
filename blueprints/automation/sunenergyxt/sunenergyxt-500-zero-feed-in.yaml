              entity_id: "{{ full_hold_entity | trim }}"
      - conditions:
          - condition: template
            value_template:
              "{{ has_full_hold_helper | bool(false)\n   and not (full_hold_state
              | bool(false))\n   and current_full_hold_state | bool(false) }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
