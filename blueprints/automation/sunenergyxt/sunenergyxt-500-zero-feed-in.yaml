    ns = namespace(entity='') %}\n  {% for entity in (device_entities(external_meter_device)
    if external_meter_device | string | trim | length > 0 else []) if ns.entity ==
    '' and entity.startswith('sensor.') %}\n    {% set name = (state_attr(entity,
    'friendly_name') or entity) | lower %}\n    {% set eid = entity | lower %}\n    {%
    if ('l3' in name or '_l3' in eid or 'phase c' in name) and ('import' in name or
    'consumption' in name) %}\n      {% set ns.entity = entity %}\n    {% endif %}\n
    \ {% endfor %}\n  {{ ns.entity | trim }}\n{% endif %}"
  meter_l1_export_entity:
    "{% set override = meter_l1_export_entity_override | string
    %} {% if override | length > 0 %}\n  {{ override | trim }}\n{% else %}\n  {% set
    ns = namespace(entity='') %}\n  {% for entity in (device_entities(external_meter_device)
    if external_meter_device | string | trim | length > 0 else []) if ns.entity ==
    '' and entity.startswith('sensor.') %}\n    {% set name = (state_attr(entity,
    'friendly_name') or entity) | lower %}\n    {% set eid = entity | lower %}\n    {%
    if ('l1' in name or '_l1' in eid or 'phase a' in name) and ('export' in name or
    'returned' in name or 'feed' in name) %}\n      {% set ns.entity = entity %}\n
    \   {% endif %}\n  {% endfor %}\n  {{ ns.entity | trim }}\n{% endif %}"
  meter_l2_export_entity:
    "{% set override = meter_l2_export_entity_override | string
    %} {% if override | length > 0 %}\n  {{ override | trim }}\n{% else %}\n  {% set
    ns = namespace(entity='') %}\n  {% for entity in (device_entities(external_meter_device)
    if external_meter_device | string | trim | length > 0 else []) if ns.entity ==
    '' and entity.startswith('sensor.') %}\n    {% set name = (state_attr(entity,
    'friendly_name') or entity) | lower %}\n    {% set eid = entity | lower %}\n    {%
    if ('l2' in name or '_l2' in eid or 'phase b' in name) and ('export' in name or
    'returned' in name or 'feed' in name) %}\n      {% set ns.entity = entity %}\n
    \   {% endif %}\n  {% endfor %}\n  {{ ns.entity | trim }}\n{% endif %}"
  meter_l3_export_entity:
    "{% set override = meter_l3_export_entity_override | string
    %} {% if override | length > 0 %}\n  {{ override | trim }}\n{% else %}\n  {% set
    ns = namespace(entity='') %}\n  {% for entity in (device_entities(external_meter_device)
    if external_meter_device | string | trim | length > 0 else []) if ns.entity ==
    '' and entity.startswith('sensor.') %}\n    {% set name = (state_attr(entity,
    'friendly_name') or entity) | lower %}\n    {% set eid = entity | lower %}\n    {%
    if ('l3' in name or '_l3' in eid or 'phase c' in name) and ('export' in name or
    'returned' in name or 'feed' in name) %}\n      {% set ns.entity = entity %}\n
    \   {% endif %}\n  {% endfor %}\n  {{ ns.entity | trim }}\n{% endif %}"
condition: []
action:
  - variables:
      failsafe_bad_states:
        - unknown
        - unavailable
        - none
        - ""
      failsafe_signed_sources:
        - shelly_total_power
        - bitshake_tasmota_power
        - ecotracker_power
        - custom_signed_total_power
      failsafe_phase_sources:
        - shelly_three_phase_sum
        - custom_three_phase_sum
      failsafe_phase_pair_sources:
        - shelly_three_phase_import_export
        - custom_three_phase_import_export
      failsafe_limit_s: "{{ max_meter_age_s | float(30) }}"
      failsafe_invalid_confirm_s:
        "{{ [failsafe_limit_s | float(30),\n    (gs_feedback_settle_s
        | float(5)) * 2,\n    10] | max }}"
      failsafe_gs_valid:
        "{% set entity = gs_entity | string | trim %} {% set value
        = states(entity) %} {{ entity.startswith('number.')\n   and value not in failsafe_bad_states\n
        \  and is_number(value) }}"
      failsafe_is_valid:
        "{% set entity = is_entity | string | trim %} {% set value
        = states(entity) %} {{ entity.startswith('number.')\n   and value not in failsafe_bad_states\n
        \  and is_number(value) }}"
      failsafe_load_valid:
        "{% set value = states(load_entity | trim) %} {{ load_entity
        | string | trim | length > 0\n   and value not in failsafe_bad_states\n   and
        is_number(value) }}"
      failsafe_gp_valid:
        "{% set value = states(gp_entity | trim) %} {{ gp_entity |
        string | trim | length > 0\n   and value not in failsafe_bad_states\n   and
        is_number(value) }}"
      failsafe_pv_valid:
        "{% set value = states(pv_entity | trim) %} {{ pv_entity |
        string | trim | length > 0\n   and value not in failsafe_bad_states\n   and
        is_number(value) }}"
      failsafe_soc_valid:
        "{% set value = states(soc_entity | trim) %} {{ soc_entity
        | string | trim | length > 0\n   and value not in failsafe_bad_states\n   and
        is_number(value) }}"
      failsafe_min_soc_valid:
        "{% set value = states(min_soc_entity | trim) %} {{ min_soc_entity
        | string | trim | length > 0\n   and value not in failsafe_bad_states\n   and
        is_number(value) }}"
      failsafe_max_soc_valid:
        "{% set value = states(max_soc_entity | trim) %} {{ max_soc_entity
        | string | trim | length > 0\n   and value not in failsafe_bad_states\n   and
        is_number(value) }}"
      failsafe_meter_valid:
        "{% set source = effective_meter_power_source | trim %}
        {% set bad = failsafe_bad_states %} {% if source in failsafe_signed_sources
        %}\n  {% set value = states(meter_entity | trim) %}\n  {{ meter_entity | string
        | trim | length > 0\n     and value not in bad\n     and is_number(value) }}\n{%
        elif source == 'ecotracker_attribute_power' %}\n  {% set value = states(meter_entity
        | trim) %}\n  {% set power = state_attr(meter_entity | trim, meter_power_attribute)
        %}\n  {{ meter_entity | string | trim | length > 0\n     and value not in bad\n
        \    and power is not none\n     and is_number(power) }}\n{% elif source in
        failsafe_phase_sources %}\n  {{ meter_l1_entity | string | trim | length > 0\n
        \    and meter_l2_entity | string | trim | length > 0\n     and meter_l3_entity
        | string | trim | length > 0\n     and states(meter_l1_entity | trim) not in
        bad\n     and states(meter_l2_entity | trim) not in bad\n     and states(meter_l3_entity
        | trim) not in bad\n     and is_number(states(meter_l1_entity | trim))\n     and
        is_number(states(meter_l2_entity | trim))\n     and is_number(states(meter_l3_entity
        | trim)) }}\n{% elif source == 'import_export_pair' %}\n  {{ meter_import_entity
        | string | trim | length > 0\n     and meter_export_entity | string | trim |
        length > 0\n     and states(meter_import_entity | trim) not in bad\n     and
        states(meter_export_entity | trim) not in bad\n     and is_number(states(meter_import_entity
        | trim))\n     and is_number(states(meter_export_entity | trim)) }}\n{% elif
        source in failsafe_phase_pair_sources %}\n  {{ meter_l1_import_entity | string
        | trim | length > 0\n     and meter_l2_import_entity | string | trim | length
        > 0\n     and meter_l3_import_entity | string | trim | length > 0\n     and
        meter_l1_export_entity | string | trim | length > 0\n     and meter_l2_export_entity
        | string | trim | length > 0\n     and meter_l3_export_entity | string | trim
        | length > 0\n     and states(meter_l1_import_entity | trim) not in bad\n     and
        states(meter_l2_import_entity | trim) not in bad\n     and states(meter_l3_import_entity
        | trim) not in bad\n     and states(meter_l1_export_entity | trim) not in bad\n
        \    and states(meter_l2_export_entity | trim) not in bad\n     and states(meter_l3_export_entity
        | trim) not in bad\n     and is_number(states(meter_l1_import_entity | trim))\n
        \    and is_number(states(meter_l2_import_entity | trim))\n     and is_number(states(meter_l3_import_entity
        | trim))\n     and is_number(states(meter_l1_export_entity | trim))\n     and
        is_number(states(meter_l2_export_entity | trim))\n     and is_number(states(meter_l3_export_entity
        | trim)) }}\n{% else %}\n  {{ false }}\n{% endif %}"
      failsafe_meter_fresh:
        "{% set source = effective_meter_power_source | trim %}
        {% set limit = failsafe_limit_s | float(30) %} {% if not (failsafe_meter_valid
        | bool(false)) %}\n  {{ false }}\n{% elif source in failsafe_signed_sources
        or source == 'ecotracker_attribute_power' %}\n  {% set age = as_timestamp(now())
        -\n     as_timestamp(states[meter_entity | trim].last_reported\n     | default(states[meter_entity
        | trim].last_updated), 0) %}\n  {{ age >= 0 and age <= limit }}\n{% elif source
        in failsafe_phase_sources %}\n  {% set ages = [\n    as_timestamp(now()) - as_timestamp(states[meter_l1_entity
        | trim].last_reported | default(states[meter_l1_entity | trim].last_updated),
        0),\n    as_timestamp(now()) - as_timestamp(states[meter_l2_entity | trim].last_reported
        | default(states[meter_l2_entity | trim].last_updated), 0),\n    as_timestamp(now())
        - as_timestamp(states[meter_l3_entity | trim].last_reported | default(states[meter_l3_entity
        | trim].last_updated), 0)] %}\n  {{ ages | select('ge', 0) | select('le', limit)
        | list | count > 0 }}\n{% elif source == 'import_export_pair' %}\n  {% set import_age
        = as_timestamp(now()) - as_timestamp(states[meter_import_entity | trim].last_reported
        | default(states[meter_import_entity | trim].last_updated), 0) %}\n  {% set
        export_age = as_timestamp(now()) - as_timestamp(states[meter_export_entity |
        trim].last_reported | default(states[meter_export_entity | trim].last_updated),
        0) %}\n  {{ import_age >= 0 and import_age <= limit\n     and export_age >=
        0 and export_age <= limit }}\n{% elif source in failsafe_phase_pair_sources
        %}\n  {% set ages = [\n    as_timestamp(now()) - as_timestamp(states[meter_l1_import_entity
        | trim].last_reported | default(states[meter_l1_import_entity | trim].last_updated),
        0),\n    as_timestamp(now()) - as_timestamp(states[meter_l2_import_entity |
        trim].last_reported | default(states[meter_l2_import_entity | trim].last_updated),
        0),\n    as_timestamp(now()) - as_timestamp(states[meter_l3_import_entity |
        trim].last_reported | default(states[meter_l3_import_entity | trim].last_updated),
        0),\n    as_timestamp(now()) - as_timestamp(states[meter_l1_export_entity |
        trim].last_reported | default(states[meter_l1_export_entity | trim].last_updated),
        0),\n    as_timestamp(now()) - as_timestamp(states[meter_l2_export_entity |
        trim].last_reported | default(states[meter_l2_export_entity | trim].last_updated),
        0),\n    as_timestamp(now()) - as_timestamp(states[meter_l3_export_entity |
        trim].last_reported | default(states[meter_l3_export_entity | trim].last_updated),
        0)] %}\n  {{ ages | select('ge', 0) | select('le', limit) | list | count > 0
        }}\n{% else %}\n  {{ false }}\n{% endif %}"
  - variables:
      failsafe_inputs_ok:
        "{{ failsafe_gs_valid | bool(false)\n   and failsafe_is_valid
        | bool(false)\n   and failsafe_meter_valid | bool(false)\n   and failsafe_meter_fresh
        | bool(false)\n   and failsafe_gp_valid | bool(false)\n   and failsafe_load_valid
        | bool(false)\n   and failsafe_pv_valid | bool(false)\n   and failsafe_soc_valid
        | bool(false)\n   and failsafe_min_soc_valid | bool(false)\n   and failsafe_max_soc_valid
        | bool(false) }}"
      failsafe_reason:
        "{% set ns = namespace(parts=[]) %} {% if not (failsafe_gs_valid
        | bool(false)) %}{% set ns.parts = ns.parts + ['GS ungültig'] %}{% endif %}
        {% if not (failsafe_is_valid | bool(false)) %}{% set ns.parts = ns.parts + ['IS
        ungültig'] %}{% endif %} {% if not (failsafe_meter_valid | bool(false)) %}\n
        \ {% set ns.parts = ns.parts + ['Netzzähler ungültig'] %}\n{% elif not (failsafe_meter_fresh
        | bool(false)) %}\n  {% set ns.parts = ns.parts + ['Netzzähler veraltet; GS
        wird gehalten'] %}\n{% endif %} {% if not (failsafe_gp_valid | bool(false))
        %}\n  {% set ns.parts = ns.parts + ['Grid-Port ungültig'] %}\n{% endif %} {%
        if not (failsafe_load_valid | bool(false)) %}\n  {% set ns.parts = ns.parts
        + ['Load-Port ungültig'] %}\n{% endif %} {% if not (failsafe_pv_valid | bool(false))
        %}\n  {% set ns.parts = ns.parts + ['PV ungültig'] %}\n{% endif %} {% if not
        (failsafe_soc_valid | bool(false)) %}\n  {% set ns.parts = ns.parts + ['SOC
        ungültig'] %}\n{% endif %} {% if not (failsafe_min_soc_valid | bool(false))
        %}{% set ns.parts = ns.parts + ['Min-SOC ungültig'] %}{% endif %} {% if not
        (failsafe_max_soc_valid | bool(false)) %}{% set ns.parts = ns.parts + ['Max-SOC
        ungültig'] %}{% endif %} {{ ns.parts | join(', ') }}"
      failsafe_hard_failure_confirmed:
        "{% set bad = failsafe_bad_states %} {% set confirm
        = failsafe_invalid_confirm_s | float(30) %} {% set ns = namespace(ages=[]) %}
        {% for entity in [is_entity, gp_entity, load_entity, pv_entity, soc_entity,\n
        \                 min_soc_entity, max_soc_entity] %}\n  {% set entity_id = entity
        | string | trim %}\n  {% if entity_id | length > 0\n        and (states(entity_id)
        in bad or not is_number(states(entity_id))) %}\n    {% if expand(entity_id)
        | count > 0 %}\n      {% set age = as_timestamp(now()) - as_timestamp(states[entity_id].last_changed,
        0) %}\n      {% set ns.ages = ns.ages + [age] %}\n    {% endif %}\n  {% endif
        %}\n{% endfor %} {% if not (failsafe_meter_valid | bool(false)) %}\n  {% set
        source = effective_meter_power_source | trim %}\n  {% if source in failsafe_signed_sources
        or source == 'ecotracker_attribute_power' %}\n    {% set meter_entities = [meter_entity]
        %}\n  {% elif source in failsafe_phase_sources %}\n    {% set meter_entities
        = [meter_l1_entity, meter_l2_entity, meter_l3_entity] %}\n  {% elif source ==
        'import_export_pair' %}\n    {% set meter_entities = [meter_import_entity, meter_export_entity]
        %}\n  {% elif source in failsafe_phase_pair_sources %}\n    {% set meter_entities
        = [meter_l1_import_entity, meter_l2_import_entity,\n                             meter_l3_import_entity,
        meter_l1_export_entity,\n                             meter_l2_export_entity,
        meter_l3_export_entity] %}\n  {% else %}\n    {% set meter_entities = [] %}\n
        \ {% endif %}\n  {% for entity in meter_entities %}\n    {% set entity_id =
        entity | string | trim %}\n    {% if entity_id | length > 0\n          and expand(entity_id)
        | count > 0\n          and source == 'ecotracker_attribute_power'\n          and
        (state_attr(entity_id, meter_power_attribute) is none\n               or not
        is_number(state_attr(entity_id, meter_power_attribute))) %}\n      {% set age
        = as_timestamp(now()) - as_timestamp(states[entity_id].last_updated, 0) %}\n
        \     {% set ns.ages = ns.ages + [age] %}\n    {% elif entity_id | length >
        0\n          and expand(entity_id) | count > 0\n          and (states(entity_id)
        in bad or not is_number(states(entity_id))) %}\n      {% set age = as_timestamp(now())
        - as_timestamp(states[entity_id].last_changed, 0) %}\n      {% set ns.ages =
        ns.ages + [age] %}\n    {% endif %}\n  {% endfor %}\n{% endif %} {{ ns.ages
        | count > 0 and (ns.ages | min) >= confirm }}"
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ not (failsafe_inputs_ok | bool(false)) }}"
        sequence:
          - variables:
              failsafe_bypass_has_helper:
                "{{ full_hold_entity | string | trim | length
                > 0 }}"
              failsafe_bypass_current_hold:
                "{{ failsafe_bypass_has_helper | bool(false)\n
                \  and is_state(full_hold_entity | trim, 'on') }}"
              failsafe_bypass_is_target_w:
                "{{ [[state_attr(is_entity | trim, 'max') |
                float(2400), 2400] | min, 0] | max }}"
              failsafe_bypass_command_active:
                "{% set gs_tolerance = [gs_resolution_w |
                float(1), 5] | max %} {% set is_tolerance = [is_resolution_w | float(10),
                20] | max %} {{ failsafe_gs_valid | bool(false)\n   and failsafe_is_valid
                | bool(false)\n   and ((states(gs_entity | trim) | float(0)) | abs) <= (gs_tolerance
                | float(5))\n   and (states(is_entity | trim) | float(0)) >= ((failsafe_bypass_is_target_w
                | float(2400)) - (is_tolerance | float(20))) }}"
              failsafe_bypass_full_hold:
                "{% set soc = states(soc_entity | trim) | float(50)
                %} {% set upper = max_charge_soc | float(100) %} {% set release = upper
                - (sa1_hysteresis_percent | float(5)) %} {% if not (failsafe_soc_valid | bool(false)) %}\n  {{ false }}\n{%
                elif failsafe_bypass_has_helper | bool(false) %}\n  {% if soc >= upper %}\n
                \   {{ true }}\n  {% elif soc <= release %}\n    {{ false }}\n  {% else
                %}\n    {{ failsafe_bypass_current_hold | bool(false) }}\n  {% endif %}\n{%
                else %}\n  {{ soc >= upper\n     or (failsafe_bypass_command_active | bool(false)\n
                \        and soc >= release) }}\n{% endif %}"
              failsafe_bypass_recovery:
                "{{ full_battery_mode == 'follow_pv'\n   and failsafe_gs_valid
                | bool(false)\n   and failsafe_is_valid | bool(false)\n   and failsafe_bypass_full_hold
                | bool(false) }}"
              failsafe_bypass_should_latch_helper:
                "{{ failsafe_bypass_recovery | bool(false)\n
                \  and failsafe_bypass_has_helper | bool(false)\n   and not (failsafe_bypass_current_hold
                | bool(false))\n   and (states(soc_entity | trim) | float(50)) >= (max_charge_soc
                | float(100)) }}"
              failsafe_bypass_should_write_gs:
                "{{ failsafe_bypass_recovery | bool(false)\n
                \  and (states(gs_entity | trim) | float(0) | abs) >= 0.5 }}"
              failsafe_bypass_should_write_is:
                "{% set resolution = [is_resolution_w | float(10),
                1] | max %} {{ failsafe_bypass_recovery | bool(false)\n   and ((states(is_entity
                | trim) | float(0)) - (failsafe_bypass_is_target_w | float(2400))) | abs
                >= resolution }}"
              failsafe_should_reset_gs:
                "{{ failsafe_gs_valid | bool(false)\n   and not
                (failsafe_bypass_recovery | bool(false))\n   and (failsafe_hard_failure_confirmed
                | bool(false))\n   and (states(gs_entity | trim) | float(0) | abs) >= 0.5
                }}"
              failsafe_log_due:
                "{% set level = diagnostic_log_level | string | trim %}
                {% set interval = [diagnostic_log_interval_s | int(60), 60] | max %} {{
                level in ['events', 'write', 'decision', 'debug']\n   and (as_timestamp(now())
                | int(0)) % interval == 0 }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ failsafe_bypass_recovery | bool(false) }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template:
                              "{{ failsafe_bypass_should_latch_helper | bool(false)
                              }}"
                        sequence:
                          - service: input_boolean.turn_on
                            continue_on_error: true
                            target:
                              entity_id: "{{ full_hold_entity | trim }}"
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ failsafe_bypass_should_write_gs | bool(false) }}"
                        sequence:
                          - service: number.set_value
                            continue_on_error: true
                            target:
                              entity_id: "{{ gs_entity | trim }}"
                            data:
                              value: 0
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ failsafe_bypass_should_write_is | bool(false) }}"
                        sequence:
                          - service: number.set_value
                            continue_on_error: true
                            target:
                              entity_id: "{{ is_entity | trim }}"
                            data:
                              value: "{{ failsafe_bypass_is_target_w }}"
                  - stop:
                      "SunEnergyXT Fail-safe: bestätigter PV-Bypass bei voller Batterie
                      wird mit GS=0 und maximalem IS beibehalten."
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ failsafe_should_reset_gs | bool(false) }}"
                sequence:
                  - service: number.set_value
                    continue_on_error: true
                    target:
                      entity_id: "{{ gs_entity | trim }}"
                    data:
                      value: 0
                  - delay:
                      seconds: "{{ [gs_feedback_settle_s | float(5), 1] | max }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ failsafe_log_due | bool(false) }}"
                sequence:
                  - service: system_log.write
                    data:
                      level: warning
                      message:
                        "SunEnergyXT Nulleinspeisung | Fail-safe aktiv, Regelrunde beendet
                        | GS-Rücksetzung={{ failsafe_should_reset_gs | bool(false) }} | Grund:
                        {{ failsafe_reason }}"
          - stop:
              "SunEnergyXT Fail-safe: ungültiger Eingang oder veralteter Zählerwert;
              Sollwerte werden gehalten."
  - variables:
      meter_signed_total_sources:
        - shelly_total_power
        - bitshake_tasmota_power
        - ecotracker_power
        - custom_signed_total_power
      meter_phase_sum_sources:
        - shelly_three_phase_sum
        - custom_three_phase_sum
      meter_phase_pair_sources:
        - shelly_three_phase_import_export
        - custom_three_phase_import_export
      meter_import_positive_presets:
        - shelly_total_power
        - shelly_three_phase_sum
        - bitshake_tasmota_power
        - ecotracker_power
        - ecotracker_attribute_power
        - custom_signed_total_power
        - custom_three_phase_sum
      meter_raw_power_before_multiplier_w:
        "{% set source = effective_meter_power_source
        | trim %} {% if source in meter_signed_total_sources %}\n  {{ states(meter_entity
        | trim) | float(0) }}\n{% elif source == 'ecotracker_attribute_power' %}\n  {{
        state_attr(meter_entity | trim, meter_power_attribute) | float(0) }}\n{% elif
        source in meter_phase_sum_sources %}\n  {{ (states(meter_l1_entity | trim) |
        float(0))\n     + (states(meter_l2_entity | trim) | float(0))\n     + (states(meter_l3_entity
        | trim) | float(0)) }}\n{% elif source == 'import_export_pair' %}\n  {{ (states(meter_export_entity
        | trim) | float(0))\n     - (states(meter_import_entity | trim) | float(0))
        }}\n{% elif source in meter_phase_pair_sources %}\n  {{ (states(meter_l1_export_entity
        | trim) | float(0))\n     + (states(meter_l2_export_entity | trim) | float(0))\n
        \    + (states(meter_l3_export_entity | trim) | float(0))\n     - (states(meter_l1_import_entity
        | trim) | float(0))\n     - (states(meter_l2_import_entity | trim) | float(0))\n
        \    - (states(meter_l3_import_entity | trim) | float(0)) }}\n{% else %}\n  {{
        0 }}\n{% endif %}"
      meter_raw_w:
        "{{ (meter_raw_power_before_multiplier_w | float(0))\n   * (meter_power_multiplier
        | float(1)) }}"
      meter_control_sample_ts:
        "{% set source = effective_meter_power_source | trim
        %} {% if source in meter_signed_total_sources or source == 'ecotracker_attribute_power'
        %}\n  {{ as_timestamp(states[meter_entity | trim].last_reported | default(states[meter_entity
        | trim].last_updated), 0) }}\n{% elif source in meter_phase_sum_sources %}\n
        \ {{ [as_timestamp(states[meter_l1_entity | trim].last_reported | default(states[meter_l1_entity
        | trim].last_updated), 0),\n      as_timestamp(states[meter_l2_entity | trim].last_reported
        | default(states[meter_l2_entity | trim].last_updated), 0),\n      as_timestamp(states[meter_l3_entity
        | trim].last_reported | default(states[meter_l3_entity | trim].last_updated),
        0)] | max }}\n{% elif source == 'import_export_pair' %}\n  {{ [as_timestamp(states[meter_import_entity
        | trim].last_reported | default(states[meter_import_entity | trim].last_updated),
        0),\n      as_timestamp(states[meter_export_entity | trim].last_reported | default(states[meter_export_entity
        | trim].last_updated), 0)] | max }}\n{% elif source in meter_phase_pair_sources
        %}\n  {{ [as_timestamp(states[meter_l1_import_entity | trim].last_reported |
        default(states[meter_l1_import_entity | trim].last_updated), 0),\n      as_timestamp(states[meter_l2_import_entity
        | trim].last_reported | default(states[meter_l2_import_entity | trim].last_updated),
        0),\n      as_timestamp(states[meter_l3_import_entity | trim].last_reported
        | default(states[meter_l3_import_entity | trim].last_updated), 0),\n      as_timestamp(states[meter_l1_export_entity
        | trim].last_reported | default(states[meter_l1_export_entity | trim].last_updated),
        0),\n      as_timestamp(states[meter_l2_export_entity | trim].last_reported
        | default(states[meter_l2_export_entity | trim].last_updated), 0),\n      as_timestamp(states[meter_l3_export_entity
        | trim].last_reported | default(states[meter_l3_export_entity | trim].last_updated),
        0)] | max }}\n{% else %}\n  {{ 0 }}\n{% endif %}"
      effective_meter_sign_mode:
        "{% set source = effective_meter_power_source | trim
        %} {% if source == 'import_export_pair' or source in meter_phase_pair_sources
        %}\n  {{ 'export_positive' }}\n{% elif meter_sign_mode == 'auto_from_preset'
        %}\n  {% if source in meter_import_positive_presets %}\n    {{ 'import_positive'
        }}\n  {% else %}\n    {{ 'export_positive' }}\n  {% endif %}\n{% else %}\n  {{
        meter_sign_mode }}\n{% endif %}"
      meter_factor:
        "{{ 1 if (effective_meter_sign_mode | trim) == 'export_positive'
        else -1 }}"
      current_gs_w: "{{ states(gs_entity | trim) | float(0) }}"
      inverter_rated_w: 2400
      has_soc:
        "{{ soc_entity | string | length > 0\n   and states(soc_entity | trim)
        not in ['unknown', 'unavailable', 'none', ''] }}"
      has_is:
        "{{ is_entity | string | length > 0\n   and states(is_entity | trim) not
        in ['unknown', 'unavailable', 'none', ''] }}"
      has_load:
        "{{ load_entity | string | length > 0\n   and states(load_entity | trim)
        not in ['unknown', 'unavailable', 'none', ''] }}"
      has_gp:
        "{{ gp_entity | string | length > 0\n   and states(gp_entity | trim) not
        in ['unknown', 'unavailable', 'none', ''] }}"
      has_pv:
        "{{ pv_entity | string | length > 0\n   and states(pv_entity | trim) not
        in ['unknown', 'unavailable', 'none', ''] }}"
  - variables:
      gs_entity_min_w:
        "{% if gs_entity | string | trim | length > 0 %}\n  {{ state_attr(gs_entity
        | trim, 'min') | float(gs_min_w | float(-2400)) }}\n{% else %}\n  {{ gs_min_w
        | float(-2400) }}\n{% endif %}"
      gs_entity_max_w:
        "{% if gs_entity | string | trim | length > 0 %}\n  {{ state_attr(gs_entity
        | trim, 'max') | float(gs_max_w | float(2400)) }}\n{% else %}\n  {{ gs_max_w
        | float(2400) }}\n{% endif %}"
      is_entity_min_w:
        "{% if has_is | bool(false) %}\n  {{ state_attr(is_entity | trim,
        'min') | float(0) }}\n{% else %}\n  {{ 0 }}\n{% endif %}"
      is_entity_max_w:
        "{% if has_is | bool(false) %}\n  {{ state_attr(is_entity | trim,
        'max') | float(inverter_rated_w | float(2400)) }}\n{% else %}\n  {{ inverter_rated_w
        | float(2400) }}\n{% endif %}"
      normalized_grid_w: "{{ (meter_raw_w | float(0)) * (meter_factor | float(1)) }}"
      soc_value:
        "{% if has_soc | bool(false) %}\n  {{ states(soc_entity | trim) | float(50)
        }}\n{% else %}\n  {{ 50 }}\n{% endif %}"
      current_is_w:
        "{% if has_is | bool(false) %}\n  {{ states(is_entity | trim) |
        float(0) }}\n{% else %}\n  {{ 0 }}\n{% endif %}"
      load_power_raw_w:
        "{% if has_load | bool(false) %}\n  {{ states(load_entity |
        trim) | float(0) }}\n{% else %}\n  {{ 0 }}\n{% endif %}"
      load_power_w:
        "{% set raw = load_power_raw_w | float(0) %} {% if raw > 32767 %}\n
        \ {{ raw - 65536 }}\n{% else %}\n  {{ raw }}\n{% endif %}"
      gp_power_raw_w:
        "{% if has_gp | bool(false) %}\n  {{ states(gp_entity | trim)
        | float(0) }}\n{% else %}\n  {{ 0 }}\n{% endif %}"
      gp_power_w:
        "{% set raw = gp_power_raw_w | float(0) %} {% if raw > 32767 %}\n
        \ {{ raw - 65536 }}\n{% else %}\n  {{ raw }}\n{% endif %}"
      pv_power_w:
        "{% if has_pv | bool(false) %}\n  {{ states(pv_entity | trim) | float(0)
        }}\n{% else %}\n  {{ 0 }}\n{% endif %}"
      effective_min_discharge_soc: "{{ min_discharge_soc | float(10) }}"
      effective_max_charge_soc: "{{ max_charge_soc | float(100) }}"
  - choose:
      - conditions:
          - condition: template
            value_template:
              "{{ ((states(min_soc_entity | trim) | float(0)) - (min_discharge_soc
              | float(10))) | abs >= 1 }}"
        sequence:
          - service: number.set_value
            continue_on_error: true
            target:
              entity_id: "{{ min_soc_entity | trim }}"
            data:
              value: "{{ min_discharge_soc }}"
  - choose:
      - conditions:
          - condition: template
            value_template:
              "{{ ((states(max_soc_entity | trim) | float(0)) - (max_charge_soc
              | float(100))) | abs >= 1 }}"
        sequence:
          - service: number.set_value
            continue_on_error: true
            target:
              entity_id: "{{ max_soc_entity | trim }}"
            data:
              value: "{{ max_charge_soc }}"
  - variables:
      has_full_hold_helper: "{{ full_hold_entity | string | trim | length > 0 }}"
      has_low_hold_helper: "{{ low_hold_entity | string | trim | length > 0 }}"
      current_full_hold_state:
        "{{ has_full_hold_helper | bool(false)\n   and is_state(full_hold_entity
        | trim, 'on') }}"
      current_low_hold_state:
        "{{ has_low_hold_helper | bool(false)\n   and is_state(low_hold_entity
        | trim, 'on') }}"
      state_mismatch_threshold_w: "{{ [small_error_w | float(30), 30] | max }}"
      full_hold_memory_band_percent: "{{ sa1_hysteresis_percent | float(5) }}"
      full_hold_bypass_command_active:
        "{% set gs_tolerance = [gs_resolution_w | float(1),
        5] | max %} {% set is_tolerance = [is_resolution_w | float(10), 20] | max %}
        {% set bypass_is_target = [is_entity_max_w | float(inverter_rated_w | float(2400)),
        inverter_rated_w | float(2400)] | min %} {{ full_battery_mode == 'follow_pv'\n
        \  and has_is | bool(false)\n   and ((current_gs_w | float(0)) | abs) <= (gs_tolerance
        | float(5))\n   and (current_is_w | float(0)) >= ((bypass_is_target | float(2400))
        - (is_tolerance | float(20))) }}"
      full_hold_bypass_memory_active:
        "{% set soc = soc_value | float(50) %} {% set
        upper = effective_max_charge_soc | float(100) %} {{ full_hold_bypass_command_active
        | bool(false)\n   and soc < upper\n   and soc >= (upper - (full_hold_memory_band_percent
        | float(1))) }}"
      full_hold_state:
        "{% set soc = soc_value | float(50) %} {% set upper = effective_max_charge_soc
        | float(100) %} {% set release = upper - (sa1_hysteresis_percent | float(5)) %}
        {% if has_full_hold_helper | bool(false) %}\n  {% if soc >= upper %}\n    {{
        true }}\n  {% elif soc <= release %}\n    {{ false }}\n  {% else %}\n    {{
        current_full_hold_state | bool(false) }}\n  {% endif %}\n{% else %}\n  {{ soc
        >= upper or full_hold_bypass_memory_active | bool(false) }}\n{% endif %}"
      low_hold_state_prelim:
        "{% set soc = soc_value | float(50) %} {% set lower = effective_min_discharge_soc
        | float(10) %} {% set release = lower + (si1_hysteresis_percent | float(5)) %}
        {% if has_low_hold_helper | bool(false) %}\n  {% if soc <= lower %}\n    {{
        true }}\n  {% elif soc >= release %}\n    {{ false }}\n  {% else %}\n    {{
        current_low_hold_state | bool(false) }}\n  {% endif %}\n{% else %}\n  {{ soc
        <= lower }}\n{% endif %}"
  - variables:
      control_error_w:
        "{{ (normalized_grid_w | float(0)) - (target_grid_power_w | float(0))
        }}"
      positive_load_power_w: "{{ [load_power_w | float(0), 0] | max }}"
      load_port_backfeed_w: "{{ [(-1 * (load_power_w | float(0))), 0] | max }}"
      effective_load_power_w:
        "{{ load_power_w | float(0) if has_load | bool(false)
        else 0 }}"
      hardware_output_limit_w:
        "{% if full_battery_mode == 'follow_pv'\n      and full_hold_state
        | bool(false)\n      and has_pv | bool(false) %}\n  {{ inverter_rated_w | float(2400)
        }}\n{% else %}\n  {{ [current_is_w | float(0), inverter_rated_w | float(2400)]
        | min }}\n{% endif %}"
      load_port_from_inverter_w:
        "{% if full_battery_mode == 'follow_pv'\n      and
        full_hold_state | bool(false)\n      and has_pv | bool(false) %}\n  {{ [positive_load_power_w
        | float(0), inverter_rated_w | float(2400)] | min }}\n{% else %}\n  {{ [positive_load_power_w
        | float(0), [current_is_w | float(0), inverter_rated_w | float(2400)] | min]
        | min }}\n{% endif %}"
      load_port_grid_supply_w:
        "{% if full_battery_mode == 'follow_pv'\n      and full_hold_state
        | bool(false)\n      and has_pv | bool(false) %}\n  {{ [(positive_load_power_w
        | float(0)) - ([positive_load_power_w | float(0), inverter_rated_w | float(2400)]
        | min), 0] | max }}\n{% else %}\n  {{ [(positive_load_power_w | float(0)) -
        ([positive_load_power_w | float(0), [current_is_w | float(0), inverter_rated_w
        | float(2400)] | min] | min), 0] | max }}\n{% endif %}"
      estimated_home_load_w:
        "{{ (gp_power_w | float(0)) - (normalized_grid_w | float(0))
        }}"
  - variables:
      load_grid_supply_target_w:
        "{% if (positive_load_power_w | float(0)) > 0 %}\n
        \ {{ [[-1 * ((target_grid_power_w | float(0)) + (estimated_home_load_w | float(0))),
        0] | max, positive_load_power_w | float(0)] | min }}\n{% else %}\n  {{ 0 }}\n{%
        endif %}"
      raw_grid_port_target_w:
        "{% if (load_port_backfeed_w | float(0)) > 0 %}\n  {{
        (target_grid_power_w | float(0)) + (estimated_home_load_w | float(0)) }}\n{%
        else %}\n  {{ (target_grid_power_w | float(0)) + (estimated_home_load_w | float(0))
        + (load_grid_supply_target_w | float(0)) }}\n{% endif %}"
      desired_load_port_output_w:
        "{% if (positive_load_power_w | float(0)) > 0 %}\n
        \ {{ (positive_load_power_w | float(0)) - (load_grid_supply_target_w | float(0))
        }}\n{% else %}\n  {{ 0 }}\n{% endif %}"
      bypass_active:
        "{{ full_battery_mode == 'follow_pv'\n   and full_hold_state |
        bool(false)\n   and has_pv | bool(false) }}"
      bypass_grid_available_w:
        "{% if full_battery_mode == 'follow_pv'\n      and full_hold_state
        | bool(false)\n      and has_pv | bool(false) %}\n  {% set pv_after_load = [(pv_power_w
        | float(0)) - (positive_load_power_w | float(0)), 0] | max %}\n  {{ [[pv_after_load
        + (load_port_backfeed_w | float(0)), 0] | max, gs_max_w | float(2400)] | min
        }}\n{% else %}\n  {{ 0 }}\n{% endif %}"
      bypass_only_candidate:
        "{{ bypass_active | bool(false)\n   and ([raw_grid_port_target_w
        | float(0), 0] | max) <= (bypass_grid_available_w | float(0)) }}"
      bypass_feedback_missing:
        "{% set threshold = state_mismatch_threshold_w | float(30)
        %} {% set required_gp = [raw_grid_port_target_w | float(0), 0] | max %} {{ bypass_active
        | bool(false)\n   and required_gp > threshold\n   and (gp_power_w | float(0))
        < (required_gp - threshold)\n   and (normalized_grid_w | float(0)) < ((target_grid_power_w
        | float(0)) - threshold) }}"
      bypass_only:
        "{{ bypass_only_candidate | bool(false) and not (bypass_feedback_missing
        | bool(false)) }}"
      raw_is_target_w:
        "{{ (desired_load_port_output_w | float(0)) + ([raw_grid_port_target_w
        | float(0), 0] | max) }}"
      pre_soc_target_is_w:
        "{% if bypass_only | bool(false) %}\n  {{ inverter_rated_w
        | float(2400) }}\n{% else %}\n  {{ raw_is_target_w | float(0) }}\n{% endif %}"
  - variables:
      low_hold_state: "{{ low_hold_state_prelim | bool(false) }}"
      charge_blocked_by_soc: "{{ full_hold_state | bool(false) }}"
      discharge_blocked_by_soc: "{{ low_hold_state | bool(false) }}"
      needs_grid_absorption:
        "{{ ((target_grid_power_w | float(0)) + (estimated_home_load_w
        | float(0))) < 0 }}"
      lp_load_import_guard:
        "{{ (positive_load_power_w | float(0)) > 0\n   and (normalized_grid_w
        | float(0)) < ((target_grid_power_w | float(0)) - (state_mismatch_threshold_w
        | float(30))) }}"
  - variables:
      charge_limited_gs_min_w:
        "{% set configured_min = gs_min_w | float(-2400) %} {%
        set entity_min = gs_entity_min_w | float(configured_min) %} {{ [configured_min,
        entity_min, -1 * (ac_couple_max_charge_power_w | float(2400))] | max }}"
      effective_gs_min_w:
        "{% set configured_min = charge_limited_gs_min_w | float(-2400)
        %} {% if bypass_only | bool(false) %}\n  {{ 0 }}\n{% elif (load_port_backfeed_w
        | float(0)) > 0 and not (needs_grid_absorption | bool(false)) %}\n  {{ [configured_min,
        0] | max }}\n{% elif lp_load_import_guard | bool(false) %}\n  {{ [configured_min,
        0] | max }}\n{% elif charge_blocked_by_soc | bool(false) %}\n  {{ [configured_min,
        0] | max }}\n{% else %}\n  {{ configured_min }}\n{% endif %}"
      effective_gs_max_w:
        "{% set configured_max = [gs_max_w | float(2400), gs_entity_max_w
        | float(2400)] | min %} {% if bypass_only | bool(false) %}\n  {{ 0 }}\n{% elif
        discharge_blocked_by_soc | bool(false) %}\n  {{ [configured_max, 0] | min }}\n{%
        else %}\n  {{ configured_max }}\n{% endif %}"
  - variables:
      unbounded_target_gs_w:
        "{% if bypass_only | bool(false) %}\n  {{ 0 }}\n{% else
        %}\n  {{ raw_grid_port_target_w | float(0) }}\n{% endif %}"
      target_gs_w:
        "{% set low = effective_gs_min_w | float(-2400) %} {% set high =
        effective_gs_max_w | float(2400) %} {{ [[unbounded_target_gs_w | float(0), low]
        | max, high] | min }}"
      # follow_pv: MPPT immer auf max, unabhaengig von full_hold/bypass_only; GS regelt weiterhin Nulleinspeisung/SOC-Grenzen.
      unclamped_target_is_w:
        "{% if discharge_blocked_by_soc | bool(false) %}\n  {{ [pre_soc_target_is_w
        | float(0), pv_power_w | float(0)] | min }}\n{% elif full_battery_mode ==
        'follow_pv' %}\n  {{ inverter_rated_w | float(2400) }}\n{% else %}\n  {{ pre_soc_target_is_w
        | float(0) }}\n{% endif %}"
      target_is_w:
        "{% set low = is_entity_min_w | float(0) %} {% set high = [is_entity_max_w
        | float(inverter_rated_w | float(2400)), inverter_rated_w | float(2400)] | min
        %} {{ [[unclamped_target_is_w | float(0), low] | max, high] | min }}"
      gs_error_w: "{{ (target_gs_w | float(0)) - (current_gs_w | float(0)) }}"
      is_error_w: "{{ (target_is_w | float(0)) - (current_is_w | float(0)) }}"
      overall_abs_error_w:
        "{{ [control_error_w | float(0) | abs,\n    is_error_w |
        float(0) | abs,\n    gs_error_w | float(0) | abs] | max }}"
      required_interval_s:
        "{% if (overall_abs_error_w | float(0)) >= (large_error_w
        | float(150)) %}\n  {{ fast_interval_s | float(1) }}\n{% elif (overall_abs_error_w
        | float(0)) >= (small_error_w | float(30)) %}\n  {{ medium_interval_s | float(5)
        }}\n{% else %}\n  {{ slow_interval_s | float(15) }}\n{% endif %}"
      proportional_delta_w:
        "{{ (gs_error_w | float(0)) * (gain_percent | float(100))
        / 100 }}"
      next_is_w:
        "{% set resolution = [is_resolution_w | float(10), 1] | max %} {% set
        rounded = (((target_is_w | float(0)) / resolution) | round(0) * resolution)
        | float(0) %} {% set low = is_entity_min_w | float(0) %} {% set high = [is_entity_max_w
        | float(inverter_rated_w | float(2400)), inverter_rated_w | float(2400)] | min
        %} {{ [[rounded, low] | max, high] | min | round(0) }}"
      seconds_since_is_change:
        "{% if has_is | bool(false) %}\n  {{ as_timestamp(now())
        - as_timestamp(states[is_entity | trim].last_changed, 0) }}\n{% else %}\n  {{
        0 }}\n{% endif %}"
      is_last_change_ts:
        "{% if has_is | bool(false) %}\n  {{ as_timestamp(states[is_entity
        | trim].last_changed, 0) }}\n{% else %}\n  {{ 0 }}\n{% endif %}"
      gs_last_change_ts:
        "{{ as_timestamp(states[gs_entity | trim].last_changed, 0)
        }}"
      control_last_change_ts:
        "{{ [as_timestamp(states[gs_entity | trim].last_changed,
        0),\n    is_last_change_ts | float(0)] | max }}"
      seconds_since_control_change:
        "{{ as_timestamp(now()) - (control_last_change_ts
        | float(0)) }}"
      control_gp_sample_after_change:
        "{{ as_timestamp(states[gp_entity | trim].last_reported
        | default(states[gp_entity | trim].last_updated), 0) > (control_last_change_ts
        | float(0)) }}"
      control_meter_sample_after_change:
        "{{ (meter_control_sample_ts | float(0)) >
        (control_last_change_ts | float(0)) }}"
      control_feedback_interval_s:
        "{{ [required_interval_s | float(1), gs_feedback_settle_s
        | float(4),\n    meter_stabilization_delay_s | float(0)] | max }}"
  - variables:
      should_write_is:
        "{{ (seconds_since_control_change | float(999)) >= (control_feedback_interval_s
        | float(8))\n   and (control_gp_sample_after_change | bool(false))\n   and (control_meter_sample_after_change
        | bool(false))\n   and ((next_is_w | float(0)) - (current_is_w | float(0)))
        | abs >= (is_resolution_w | float(10)) }}"
  - variables:
      max_adjustment_w:
        "{% if (overall_abs_error_w | float(0)) >= (large_error_w |
        float(150)) %}\n  {{ fast_max_step_w | float(500) }}\n{% elif (overall_abs_error_w
        | float(0)) >= (small_error_w | float(30)) %}\n  {{ medium_max_step_w | float(100)
        }}\n{% else %}\n  {{ small_max_step_w | float(20) }}\n{% endif %}"
  - variables:
      limited_delta_w:
        "{% set delta = proportional_delta_w | float(0) %} {% set limit
        = max_adjustment_w | float(20) %} {{ [[delta, -limit] | max, limit] | min }}"
  - variables:
      stepped_target_gs_w:
        "{{ (current_gs_w | float(0)) + (limited_delta_w | float(0))
        }}"
  - variables:
      next_gs_w:
        "{% set resolution = [gs_resolution_w | float(1), 1] | max %} {% set
        rounded = (((stepped_target_gs_w | float(0)) / resolution) | round(0) * resolution)
        | float(0) %} {% set low = effective_gs_min_w | float(-2400) %} {% set high
        = effective_gs_max_w | float(2400) %} {{ [[rounded, low] | max, high] | min
        | round(0) }}"
  - variables:
      seconds_since_gs_change:
        "{{ as_timestamp(now()) - as_timestamp(states[gs_entity
        | trim].last_changed, 0) }}"
  - variables:
      should_write_gs:
        "{{ (seconds_since_control_change | float(999)) >= (control_feedback_interval_s
        | float(8))\n   and (control_gp_sample_after_change | bool(false))\n   and (control_meter_sample_after_change
        | bool(false))\n   and (next_gs_w | float(0)) != (current_gs_w | float(0)) }}"
      diagnostic_decision_log_due:
        "{% set level = diagnostic_log_level | string | trim
        %} {% set interval = 5 if level == 'debug' else ([diagnostic_log_interval_s
        | float(60), 10] | max) %} {% set now_ts = as_timestamp(now()) | int(0) %} {{
        level in ['decision', 'debug']\n   and (now_ts % (interval | int(60))) == 0
        }}"
  - choose:
      - conditions:
          - condition: template
            value_template:
              "{{ has_full_hold_helper | bool(false)\n   and full_hold_state
              | bool(false)\n   and not (current_full_hold_state | bool(false)) }}"
        sequence:
          - choose:
