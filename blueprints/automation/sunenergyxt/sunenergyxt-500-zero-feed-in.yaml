    %} {% if override | length > 0 %}\n  {{ override | trim }}\n{% else %}\n  {% set
    ns = namespace(entity='') %}\n  {% for entity in (device_entities(external_meter_device)
    if external_meter_device | string | trim | length > 0 else []) if ns.entity ==
    '' and entity.startswith('sensor.') %}\n    {% set name = (state_attr(entity,
