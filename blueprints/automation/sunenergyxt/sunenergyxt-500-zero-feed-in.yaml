blueprint:
  name: SunEnergyXT 500 Serie - Nulleinspeisung
  description:
    "Nulleinspeise-Regler für SunEnergyXT 500 / 500 Pro mit einem externen
    Home Assistant-Zähler. Die Automatisierung verwendet keine Betriebsmodus- oder
    Entlademodus-Schalter des Geräts. Wählen Sie den Zählertyp und das SunEnergyXT-Gerät;
    der Blueprint erkennt gängige HA-/HACS-Zählerformen wie Shelly, BitShake / Tasmota,
    EcoTracker, vorzeichenbehaftete Gesamtleistung, Dreiphasenleistung sowie Bezug-/Einspeisepaare.
    Die Automatisierung steuert anschließend den Sollwert Leistung Netzanschluss und
    den Sollwert max. Wechselrichterleistung mit derselben Topologielogik wie der
    Simulator.

    "
  domain: automation
  homeassistant:
    min_version: 2024.6.0
  source_url: https://raw.githubusercontent.com/SunEnergyXT/sunenergyxt-500-zero-feed-in-blueprint/main/blueprints/automation/sunenergyxt/sunenergyxt-500-zero-feed-in.yaml
  input:
    required_devices:
      name: SunEnergyXT-Einrichtung
      icon: mdi:devices
      description:
        "Wählen Sie das SunEnergyXT-All-in-one-Gerät und die wichtigsten
        Benutzereinstellungen. Der Blueprint bindet passende Entitäten dieses Geräts
        automatisch und schreibt die SOC-Grenzen in die Geräteeinstellungen.

        "
      input:
        aio_device:
          name: SunEnergyXT-Gerät
          description:
            "Wählen Sie das SunEnergyXT 500 / 500 Pro Gerät. Der Blueprint
            sucht automatisch den Sollwert Leistung Netzanschluss, den Sollwert max.
            Wechselrichterleistung, die Systemleistung am Lastanschluss, die Systemleistung
            am Netzanschluss, die PV-Gesamteingangsleistung, das System-Speicherlevel
            und die SOC-Grenzentitäten dieses Geräts.

            "
          selector:
            device:
              filter:
                - integration: sunenergyxt
              multiple: false
        full_battery_mode:
          name: Verhalten bei voller Batterie
          default: follow_load
          selector:
            select:
              options:
                - label: Nach Vollladung Last folgen
                  value: follow_load
                - label: Nach Vollladung PV folgen
                  value: follow_pv
              multiple: false
              sort: false
              custom_value: false
        gs_max_w:
          name: Maximale Netzeinspeiseleistung
          description:
            "Maximal erlaubte Netzeinspeiseleistung. Verwenden Sie 800
            W für SunEnergyXT 500 und 2400 W für SunEnergyXT 500 Pro, sofern vor Ort
            kein niedrigerer Grenzwert erforderlich ist.

            "
          default: 2400
          selector:
            number:
              min: 0.0
              max: 2400.0
              step: 1.0
              unit_of_measurement: W
              mode: box
        min_discharge_soc:
          name: System Entladegrenze
          description:
            "Schreibt die System Entladegrenze des ausgewählten SunEnergyXT-
            Geräts. Die Automatisierung verwendet diesen Wert außerdem als Steuergrenze
            bei niedrigem SOC.

            "
          default: 10
          selector:
            number:
              min: 1.0
              max: 30.0
              step: 1.0
              unit_of_measurement: "%"
              mode: box
        max_charge_soc:
          name: System Ladegrenze
          description:
            "Schreibt die System Ladegrenze des ausgewählten SunEnergyXT-Geräts.
            Die Automatisierung verwendet diesen Wert außerdem als Steuergrenze bei
            voller Batterie.

            "
          default: 100
          selector:
            number:
              min: 70.0
              max: 100.0
              step: 1.0
              unit_of_measurement: "%"
              mode: box
        ac_couple_max_charge_power_w:
          name: Maximale AC-gekoppelte Ladeleistung
          description:
            "Begrenzt die AC-seitige Lade-/Aufnahmeleistung. SunEnergyXT
            500 und 500 Pro können hier bis zu 2400 W verwenden, sofern vor Ort kein
            niedrigerer Grenzwert gilt.

            "
          default: 2400
          selector:
            number:
              min: 0.0
              max: 2400.0
              step: 1.0
              unit_of_measurement: W
              mode: box
    meter_setup:
      name: Zähler-Einrichtung
      icon: mdi:meter-electric
      description:
        "Wählen Sie genau einen Zählertyp. Home Assistant Blueprints können
        Felder anhand dieser Auswahl nicht dynamisch ausblenden. Öffnen Sie daher
        nur das passende Zählerformular unten und lassen Sie die anderen Formulare
        leer.

        "
      input:
        meter_power_source:
          name: Zählertyp
          description:
            "Wählen Sie die Form der Zählerintegration. Füllen Sie nur
            die Felder aus, die zum ausgewählten Typ passen.

            "
          selector:
            select:
              options:
                - label: Shelly Pro 3EM
                  value: shelly_total_power
                - label: EcoTracker
                  value: ecotracker_power
                - label: BitShake / Tasmota
                  value: bitshake_tasmota_power
                - label: Shelly 3EM
                  value: shelly_three_phase_sum
                - label: Benutzerdefinierter Zähler
                  value: custom
              multiple: false
              sort: false
              custom_value: false
    meter_pro3em_setup:
      name: Shelly Pro 3EM Zähler
      icon: mdi:meter-electric
      collapsed: true
      description:
        "Dieses Formular nur ausfüllen, wenn als Zählertyp Shelly Pro 3EM
        ausgewählt ist.

        "
      input:
        pro3em_meter_device:
          name: Shelly Pro 3EM Gerät
          description: "Wählen Sie das Shelly Pro 3EM Zählergerät.

            "
          default: ""
          selector:
            device:
              entity:
                - domain:
                    - sensor
              multiple: false
    meter_ecotracker_setup:
      name: EcoTracker-Zähler
      icon: mdi:meter-electric
      collapsed: true
      description:
        "Dieses Formular nur ausfüllen, wenn als Zählertyp EcoTracker ausgewählt
        ist.

        "
      input:
        ecotracker_meter_device:
          name: EcoTracker-Gerät
          description: "Wählen Sie das EcoTracker-Zählergerät.

            "
          default: ""
          selector:
            device:
              entity:
                - domain:
                    - sensor
              multiple: false
    meter_bitshake_setup:
      name: BitShake-/Tasmota-Zähler
      icon: mdi:meter-electric
      collapsed: true
      description:
        "Dieses Formular nur ausfüllen, wenn als Zählertyp BitShake / Tasmota
        ausgewählt ist.

        "
      input:
        bitshake_meter_device:
          name: BitShake-/Tasmota-Gerät
          description: "Wählen Sie das BitShake- oder Tasmota-Zählergerät.

            "
          default: ""
          selector:
            device:
              entity:
                - domain:
                    - sensor
              multiple: false
    meter_shelly3em_setup:
      name: Shelly-3EM-Zähler
      icon: mdi:meter-electric
      collapsed: true
      description:
        "Dieses Formular nur ausfüllen, wenn als Zählertyp Shelly 3EM ausgewählt
        ist. Wählen Sie die drei Phasengeräte; der Blueprint liest die Leistung jeder
        Phase vom jeweiligen Gerät.

        "
      input:
        meter_l1_device:
          name: Shelly 3EM Phase A / L1 Gerät
          description: "Wählen Sie das HA-Gerät für Phase A / L1.

            "
          default: ""
          selector:
            device:
              entity:
                - domain:
                    - sensor
              multiple: false
        meter_l2_device:
          name: Shelly 3EM Phase B / L2 Gerät
          description: "Wählen Sie das HA-Gerät für Phase B / L2.

            "
          default: ""
          selector:
            device:
              entity:
                - domain:
                    - sensor
              multiple: false
        meter_l3_device:
          name: Shelly 3EM Phase C / L3 Gerät
          description: "Wählen Sie das HA-Gerät für Phase C / L3.

            "
          default: ""
          selector:
            device:
              entity:
                - domain:
                    - sensor
              multiple: false
    meter_custom_setup:
      name: Benutzerdefinierter Zähler
      icon: mdi:meter-electric
      collapsed: true
      description:
        "Dieses Formular nur ausfüllen, wenn als Zählertyp Benutzerdefinierter
        Zähler ausgewählt ist. Ein benutzerdefinierter Zähler benötigt kein Zählergerät;
        wählen Sie eine Formel und geben Sie die passenden Entitäten an.

        "
      input:
        custom_meter_formula:
          name: Leistungsformel des benutzerdefinierten Zählers
          description:
            "Der Blueprint wendet diese Formel auf die unten angegebenen
            Entitäten an.

            "
          default: custom_signed_total_power
          selector:
            select:
              options:
                - label: Vorzeichenbehaftete Gesamtleistung
                  value: custom_signed_total_power
                - label: L1 + L2 + L3
                  value: custom_three_phase_sum
                - label: Einspeisung - Bezug
                  value: import_export_pair
                - label: L1-L3 Einspeisung - Bezug
                  value: custom_three_phase_import_export
                - label: Entitätsattribut
                  value: ecotracker_attribute_power
              multiple: false
              sort: false
              custom_value: false
        meter_power_sensor:
          name: Benutzerdefinierte Gesamt-/Aktualleistungsentität
          description:
            "Für vorzeichenbehaftete Gesamtleistung oder Entitätsattribut
            verwenden.

            "
          default: ""
          selector:
            entity:
              domain:
                - sensor
              multiple: false
              reorder: false
        meter_power_attribute:
          name: Benutzerdefiniertes Leistungsattribut
          description:
            "Nur verwenden, wenn die Leistungsformel Entitätsattribut ist.
            Der übliche Attributname ist power.

            "
          default: power
          selector:
            text:
              multiple: false
              multiline: false
        meter_l1_power_sensor:
          name: Benutzerdefinierte L1-/Phase-A-Leistungsentität
          description:
            "Für die benutzerdefinierte Formel L1 + L2 + L3 verwenden.

            "
          default: ""
          selector:
            entity:
              domain:
                - sensor
              multiple: false
              reorder: false
        meter_l2_power_sensor:
          name: Benutzerdefinierte L2-/Phase-B-Leistungsentität
          description:
            "Für die benutzerdefinierte Formel L1 + L2 + L3 verwenden.

            "
          default: ""
          selector:
            entity:
              domain:
                - sensor
              multiple: false
              reorder: false
        meter_l3_power_sensor:
          name: Benutzerdefinierte L3-/Phase-C-Leistungsentität
          description:
            "Für die benutzerdefinierte Formel L1 + L2 + L3 verwenden.

            "
          default: ""
          selector:
            entity:
              domain:
                - sensor
              multiple: false
              reorder: false
        meter_import_power_sensor:
          name: Benutzerdefinierte Bezugsleistungsentität
          description:
            "Für die benutzerdefinierte Formel Einspeisung - Bezug verwenden.

            "
          default: ""
          selector:
            entity:
              domain:
                - sensor
              multiple: false
              reorder: false
        meter_export_power_sensor:
          name: Benutzerdefinierte Einspeiseleistungsentität
          description:
            "Für die benutzerdefinierte Formel Einspeisung - Bezug verwenden.

            "
          default: ""
          selector:
            entity:
              domain:
                - sensor
              multiple: false
              reorder: false
        meter_l1_import_power_sensor:
          name: Benutzerdefinierte L1-/Phase-A-Bezugsleistungsentität
          description:
            "Für die benutzerdefinierte Formel L1-L3 Einspeisung - Bezug
            verwenden.

            "
          default: ""
          selector:
            entity:
              domain:
                - sensor
              multiple: false
              reorder: false
        meter_l2_import_power_sensor:
          name: Benutzerdefinierte L2-/Phase-B-Bezugsleistungsentität
          description:
            "Für die benutzerdefinierte Formel L1-L3 Einspeisung - Bezug
            verwenden.

            "
          default: ""
          selector:
            entity:
              domain:
                - sensor
              multiple: false
              reorder: false
        meter_l3_import_power_sensor:
          name: Benutzerdefinierte L3-/Phase-C-Bezugsleistungsentität
          description:
            "Für die benutzerdefinierte Formel L1-L3 Einspeisung - Bezug
            verwenden.

            "
          default: ""
          selector:
            entity:
              domain:
                - sensor
              multiple: false
              reorder: false
        meter_l1_export_power_sensor:
          name: Benutzerdefinierte L1-/Phase-A-Einspeiseleistungsentität
          description:
            "Für die benutzerdefinierte Formel L1-L3 Einspeisung - Bezug
            verwenden.

            "
          default: ""
          selector:
            entity:
              domain:
                - sensor
              multiple: false
              reorder: false
        meter_l2_export_power_sensor:
          name: Benutzerdefinierte L2-/Phase-B-Einspeiseleistungsentität
          description:
            "Für die benutzerdefinierte Formel L1-L3 Einspeisung - Bezug
            verwenden.

            "
          default: ""
          selector:
            entity:
              domain:
                - sensor
              multiple: false
              reorder: false
        meter_l3_export_power_sensor:
          name: Benutzerdefinierte L3-/Phase-C-Einspeiseleistungsentität
          description:
            "Für die benutzerdefinierte Formel L1-L3 Einspeisung - Bezug
            verwenden.

            "
          default: ""
          selector:
            entity:
              domain:
                - sensor
              multiple: false
              reorder: false
    advanced_entity_overrides:
      name: Erweiterte Entitätsüberschreibungen
      icon: mdi:form-select
      collapsed: true
      description:
        "Für die automatische gerätebasierte Bindung leer lassen. Nur öffnen,
        wenn das ausgewählte Gerät ungewöhnliche Entitätsnamen bereitstellt und das
        automatische Ergebnis falsch ist.

        "
      input:
        gs_number:
          name: Entität für Sollwert Leistung Netzanschluss überschreiben
          default: ""
          selector:
            entity:
              domain:
                - number
              multiple: false
              reorder: false
        is_number:
          name: Entität für Sollwert max. Wechselrichterleistung überschreiben
          default: ""
          selector:
            entity:
              domain:
                - number
              multiple: false
              reorder: false
        load_power_sensor:
          name: Sensor für Systemleistung am Lastanschluss überschreiben
          default: ""
          selector:
            entity:
              domain:
                - sensor
              multiple: false
              reorder: false
        grid_port_power_sensor:
          name: Sensor für Systemleistung am Netzanschluss überschreiben
          default: ""
          selector:
            entity:
              domain:
                - sensor
              multiple: false
              reorder: false
        pv_power_sensor:
          name: Sensor für PV-Gesamteingangsleistung überschreiben
          default: ""
          selector:
            entity:
              domain:
                - sensor
              multiple: false
              reorder: false
        soc_sensor:
          name: Sensor für System-Speicherlevel überschreiben
          default: ""
          selector:
            entity:
              domain:
                - sensor
              multiple: false
              reorder: false
        min_discharge_soc_number:
          name: Number-Entität für System Entladegrenze überschreiben
          default: ""
          selector:
            entity:
              domain:
                - number
              multiple: false
              reorder: false
        max_charge_soc_number:
          name: Number-Entität für System Ladegrenze überschreiben
          default: ""
          selector:
            entity:
              domain:
                - number
              multiple: false
              reorder: false
        charge_hysteresis_number:
          name: Number-Entität für Lade-SOC-Hysterese (SA1) überschreiben
          description:
            "Geräteseitiger Hysteresewert, mit dem der Blueprint den Vollladungs-Haltezustand
            wieder freigibt. Standardmäßig automatisch erkannt (SunEnergyXT-Register
            SA1, Werkseinstellung 5 %).

            "
          default: ""
          selector:
            entity:
              domain:
                - number
              multiple: false
              reorder: false
        discharge_hysteresis_number:
          name: Number-Entität für Entlade-SOC-Hysterese (SI1) überschreiben
          description:
            "Geräteseitiger Hysteresewert, mit dem der Blueprint den Niedrig-SOC-Haltezustand
            wieder freigibt. Standardmäßig automatisch erkannt (SunEnergyXT-Register
            SI1, Werkseinstellung 5 %).

            "
          default: ""
          selector:
            entity:
              domain:
                - number
              multiple: false
              reorder: false
    advanced_meter_settings:
      name: Erweiterte Zähler-Vorzeichen- und Einheitseinstellungen
      icon: mdi:meter-electric
      collapsed: true
      input:
        meter_sign_mode:
          name: Vorzeichenkonvention des Zählers
          description:
            "Automatisch verwendet die Vorgabe des ausgewählten Zählertyps.
            Wählen Sie eine feste Vorgabe, wenn Stromwandler, Skript oder Template
            das entgegengesetzte Vorzeichen liefern.

            "
          default: auto_from_preset
          selector:
            select:
              options:
                - label: Automatisch nach ausgewähltem Zählertyp
                  value: auto_from_preset
                - label: Einspeisung ist positiv
                  value: export_positive
                - label: Netzbezug ist positiv
                  value: import_positive
              multiple: false
              sort: false
              custom_value: false
        meter_power_multiplier:
          name: Leistungsfaktor externer Zähler
          description:
            "1 verwenden, wenn die Entität bereits W liefert. 1000 verwenden,
            wenn die Entität kW liefert.

            "
          default: 1
          selector:
            number:
              min: 0.001
              max: 1000.0
              step: 0.001
              mode: box
    advanced_control_settings:
      name: Erweiterte Steuerungseinstellungen
      icon: mdi:cog-outline
      collapsed: true
      input:
        target_grid_power_w:
          name: Ziel-Netzleistung
          description:
            "Nulleinspeisung verwendet 0 W. Positive Werte halten bewusst
            eine kleine Einspeisung; negative Werte halten bewusst einen kleinen Bezug.

            "
          default: 0
          selector:
            number:
              min: -200.0
              max: 200.0
              step: 1.0
              unit_of_measurement: W
              mode: box
        target_grid_power_entity:
          name: Optionaler Helper für Ziel-Netzleistung
          description:
            "Optionaler input_number-Helper für einen dynamischen Zielwert.
            Ist kein Helper ausgewählt oder sein Zustand ungültig, wird die oben eingestellte
            Ziel-Netzleistung verwendet.

            "
          default: ""
          selector:
            entity:
              domain:
                - input_number
              multiple: false
              reorder: false
        gs_min_w:
          name: Untere Grenze für Sollwert Leistung Netzanschluss
          description:
            "Minimal erlaubter Sollwert Leistung Netzanschluss. Negative
            Werte erlauben Netzbezug bzw. Laden, um Überschussleistung aufzunehmen.

            "
          default: -2400
          selector:
            number:
              min: -2400.0
              max: 0.0
              step: 1.0
              unit_of_measurement: W
              mode: box
        gs_resolution_w:
          name: Schreibauflösung Sollwert Leistung Netzanschluss
          default: 1
          selector:
            number:
              min: 1.0
              max: 50.0
              step: 1.0
              unit_of_measurement: W
              mode: box
        gain_percent:
          name: Korrekturverstärkung
          default: 100
          selector:
            number:
              min: 20.0
              max: 150.0
              step: 5.0
              unit_of_measurement: "%"
              mode: slider
        small_error_w:
          name: Schwelle für kleinen Fehler
          default: 30
          selector:
            number:
              min: 1.0
              max: 300.0
              step: 1.0
              unit_of_measurement: W
              mode: box
        large_error_w:
          name: Schwelle für großen Fehler
          default: 150
          selector:
            number:
              min: 10.0
              max: 1000.0
              step: 10.0
              unit_of_measurement: W
              mode: box
        slow_interval_s:
          name: Langsames Schreibintervall
          default: 7
          selector:
            number:
              min: 1.0
              max: 120.0
              step: 0.5
              unit_of_measurement: s
              mode: box
        medium_interval_s:
          name: Mittleres Schreibintervall
          default: 2.5
          selector:
            number:
              min: 0.5
              max: 60.0
              step: 0.5
              unit_of_measurement: s
              mode: box
        fast_interval_s:
          name: Schnelles Schreibintervall
          default: 1
          selector:
            number:
              min: 1.0
              max: 20.0
              step: 1.0
              unit_of_measurement: s
              mode: box
        gs_feedback_settle_s:
          name: Einschwingzeit der Regelungsrückmeldung
          description:
            "Mindestzeit nach dem Schreiben des Sollwerts Leistung Netzanschluss
            oder des Sollwerts max. Wechselrichterleistung bis zum nächsten Schreibvorgang.
            Die Automatisierung wartet außerdem auf neue Netzanschluss- und Zählerwerte
            nach der letzten Änderung. Der Standardwert passt zur beobachteten SunEnergyXT-Rückmeldezeit
            und reduziert Schwingen bei Änderungen externer Geräte.

            "
          default: 5
          selector:
            number:
              min: 1.0
              max: 30.0
              step: 1.0
              unit_of_measurement: s
              mode: box
        meter_stabilization_delay_s:
          name: Zusätzliche Wartezeit bei verzögerter Zählerrückmeldung
          description:
            "Optionale zusätzliche Wartezeit nach einem GS- oder IS-Schreibvorgang,
            bevor erneut geregelt wird. Bei Zählern ohne merkliche Verzögerung 0 s
            beibehalten. Den Wert etwas größer als die gemessene inhaltliche Verzögerung
            einstellen, wenn der Zähler in Home Assistant zwar neue Zeitstempel meldet,
            der Leistungswert aber noch den Zustand vor dem letzten Schreibvorgang
            zeigt. Ein zu kleiner Wert kann Schwingen zulassen; ein zu großer Wert
            verlangsamt die Reaktion auf echte Laständerungen.

            "
          default: 0
          selector:
            number:
              min: 0.0
              max: 60.0
              step: 1.0
              unit_of_measurement: s
              mode: box
        small_max_step_w:
          name: Maximale Anpassung bei kleinem Fehler
          default: 20
          selector:
            number:
              min: 1.0
              max: 300.0
              step: 1.0
              unit_of_measurement: W
              mode: box
        medium_max_step_w:
          name: Maximale Anpassung bei mittlerem Fehler
          default: 120
          selector:
            number:
              min: 10.0
              max: 1000.0
              step: 10.0
              unit_of_measurement: W
              mode: box
        fast_max_step_w:
          name: Maximale Anpassung bei großem Fehler
          default: 450
          selector:
            number:
              min: 50.0
              max: 2400.0
              step: 10.0
              unit_of_measurement: W
              mode: box
        max_meter_age_s:
          name: Maximales Alter des Zählerwerts
          description:
            "Maximales Alter des externen Zählerwerts, bevor die aktuelle
            Regelrunde pausiert und den aktuellen GS-Wert beibehält. Ein ausdrücklich
            ungültiger kritischer Eingang muss mindestens ebenso lange ungültig bleiben,
            bevor ein GS ungleich 0 einmalig auf 0 W zurückgesetzt wird.

            "
          default: 30
          selector:
            number:
              min: 2.0
              max: 300.0
              step: 1.0
              unit_of_measurement: s
              mode: box
        is_resolution_w:
          name: Schreibauflösung Sollwert max. Wechselrichterleistung
          default: 10
          selector:
            number:
              min: 1.0
              max: 100.0
              step: 1.0
              unit_of_measurement: W
              mode: box
        diagnostic_log_level:
          name: Diagnose-Log-Stufe
          description:
            "Aus schreibt keine Diagnose-Logs. Ereignisse protokolliert
            SOC-Haltewechsel. Schreibvorgänge ergänzt Setpoint-Schreibvorgänge. Entscheidungen
            ergänzt periodische Regelentscheidungen. Debug schreibt Entscheidungs-Logs
            alle 5 Sekunden.

            "
          default: false
          selector:
            select:
              options:
                - label: Aus
                  value: "off"
                - label: Ereignisse
                  value: events
                - label: Schreibvorgänge
                  value: write
                - label: Entscheidungen
                  value: decision
                - label: Debug
                  value: debug
              multiple: false
              sort: false
              custom_value: false
        diagnostic_log_interval_s:
          name: Intervall für Entscheidungs-Logs
          description:
            "Mindestintervall für periodische Entscheidungs-Logs. Debug-
            Entscheidungs-Logs verwenden ein festes Intervall von 5 s. Ereignis- und
            Schreib-Logs werden nur ausgegeben, wenn die jeweilige Aktion tatsächlich
            passiert.

            "
          default: 60
          selector:
            number:
              min: 10.0
              max: 3600.0
              step: 10.0
              unit_of_measurement: s
              mode: box
        full_charge_hold_helper:
          name: Optionaler Helper für Haltezustand volle Batterie
          description:
            "Optional. Leer lassen, außer die Automatisierung soll den
            Haltezustand volle Batterie über Neustarts hinweg speichern. Ohne diesen
            Helper leitet die Automatisierung den Zustand aus dem aktuellen SOC ab,
            mit einem 1%-Speicherband für volle Batterie im Modus Nach Vollladung
            PV folgen.

            "
          default: ""
          selector:
            entity:
              domain:
                - input_boolean
              multiple: false
              reorder: false
        low_discharge_hold_helper:
          name: Optionaler Helper für Niedrig-SOC-Haltezustand
          description:
            "Optional. Leer lassen, außer die Automatisierung soll den
            Niedrig-SOC- Haltezustand über Neustarts hinweg speichern. Ohne diesen
            Helper leitet die Automatisierung den Zustand direkt aus dem aktuellen
            SOC ab.

            "
          default: ""
          selector:
            entity:
              domain:
                - input_boolean
              multiple: false
              reorder: false
